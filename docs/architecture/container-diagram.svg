<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1160" viewBox="0 0 1760 1160">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2c333a"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1760" height="1160" fill="#ffffff"/>

  <text x="40" y="42" font-size="28" font-weight="700" fill="#142033">Figure 1. Container diagram</text>
  <text x="40" y="72" font-size="15" fill="#3c4a5a">Dashed boundary = the carpooling system. Grey boxes = external systems. Every arrow is labelled with its purpose and protocol.</text>

  <!-- People -->
  <rect x="48" y="100" width="250" height="76" rx="6" fill="#08427B"/>
  <text x="173" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Student</text>
  <text x="173" y="154" text-anchor="middle" font-size="14" fill="#e6eef8">Passenger or driver</text>

  <rect x="330" y="100" width="290" height="76" rx="6" fill="#08427B"/>
  <text x="475" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Administrator</text>
  <text x="475" y="154" text-anchor="middle" font-size="14" fill="#e6eef8">Moderates users and reports</text>

  <!-- System boundary -->
  <rect x="36" y="268" width="1144" height="692" rx="10" fill="#f4f7fb" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="790" y="254" width="340" height="28" fill="#ffffff"/>
  <text x="960" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">University Carpooling System</text>

  <!-- Web App -->
  <rect x="56" y="312" width="520" height="176" rx="6" fill="#438DD5" stroke="#2d6eae" stroke-width="1.5"/>
  <text x="76" y="344" font-size="20" font-weight="700" fill="#ffffff">Web App</text>
  <text x="76" y="366" font-size="14" font-style="italic" fill="#eaf3fc">[Browser, runnable app]</text>
  <text x="76" y="396" font-size="15" fill="#ffffff">User interface for passengers, drivers and administrators:</text>
  <text x="76" y="418" font-size="15" fill="#ffffff">search, create and cancel trips, reserve a seat, view trip</text>
  <text x="76" y="440" font-size="15" fill="#ffffff">details, and open admin screens.</text>
  <text x="76" y="464" font-size="15" fill="#ffffff">Holds no business rules.</text>

  <!-- Backend API -->
  <rect x="800" y="304" width="340" height="192" rx="6" fill="#438DD5" stroke="#2d6eae" stroke-width="1.5"/>
  <text x="820" y="336" font-size="20" font-weight="700" fill="#ffffff">Backend API</text>
  <text x="820" y="358" font-size="14" font-style="italic" fill="#eaf3fc">[Modular monolith]</text>
  <text x="820" y="388" font-size="15" fill="#ffffff">Verifies students, manages trips</text>
  <text x="820" y="410" font-size="15" fill="#ffffff">and reservations, checks every</text>
  <text x="820" y="432" font-size="15" fill="#ffffff">request, writes notification</text>
  <text x="820" y="454" font-size="15" fill="#ffffff">records, and moderates.</text>

  <!-- Notification Worker -->
  <rect x="56" y="640" width="520" height="176" rx="6" fill="#438DD5" stroke="#2d6eae" stroke-width="1.5"/>
  <text x="76" y="672" font-size="20" font-weight="700" fill="#ffffff">Notification Worker</text>
  <text x="76" y="694" font-size="14" font-style="italic" fill="#eaf3fc">[Runnable service]</text>
  <text x="76" y="724" font-size="15" fill="#ffffff">Reads pending notification records and sends</text>
  <text x="76" y="746" font-size="15" fill="#ffffff">e-mail (FR7). Runs separately so a slow e-mail</text>
  <text x="76" y="768" font-size="15" fill="#ffffff">provider never delays search or reservations.</text>

  <!-- Database -->
  <path d="M855,648 V836 A115,20 0 0 0 1085,836 V648 Z" fill="#438DD5" stroke="#2d6eae" stroke-width="1.5"/>
  <ellipse cx="970" cy="648" rx="115" ry="20" fill="#6aade0" stroke="#2d6eae" stroke-width="1.5"/>
  <text x="970" y="692" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Database</text>
  <text x="970" y="714" text-anchor="middle" font-size="13" font-style="italic" fill="#eaf3fc">[PostgreSQL]</text>
  <text x="970" y="740" text-anchor="middle" font-size="13" fill="#ffffff">Users, trips, reservations,</text>
  <text x="970" y="758" text-anchor="middle" font-size="13" fill="#ffffff">reports, notification queue.</text>
  <text x="970" y="778" text-anchor="middle" font-size="13" fill="#ffffff">Transactions prevent</text>
  <text x="970" y="796" text-anchor="middle" font-size="13" fill="#ffffff">double booking.</text>

  <!-- External: University -->
  <rect x="1320" y="312" width="400" height="168" rx="6" fill="#8a8a8a" stroke="#6a6a6a" stroke-width="1.5"/>
  <text x="1340" y="346" font-size="18" font-weight="700" fill="#ffffff">University Email / ID System</text>
  <text x="1340" y="370" font-size="14" font-style="italic" fill="#f3f3f3">[External system]</text>
  <text x="1340" y="402" font-size="15" fill="#ffffff">Confirms that the user is a student</text>
  <text x="1340" y="424" font-size="15" fill="#ffffff">during registration.</text>

  <!-- External: Email -->
  <rect x="56" y="1000" width="520" height="120" rx="6" fill="#8a8a8a" stroke="#6a6a6a" stroke-width="1.5"/>
  <text x="76" y="1034" font-size="18" font-weight="700" fill="#ffffff">Email Service</text>
  <text x="76" y="1056" font-size="14" font-style="italic" fill="#f3f3f3">[External system]</text>
  <text x="76" y="1086" font-size="15" fill="#ffffff">Delivers e-mail about reservation and trip changes.</text>

  <!-- Arrows -->
  <line x1="173" y1="176" x2="173" y2="306" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="475" y1="176" x2="475" y2="306" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="576" y1="400" x2="794" y2="400" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="1140" y1="390" x2="1314" y2="390" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="970" y1="496" x2="970" y2="622" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="576" y1="728" x2="849" y2="728" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="316" y1="816" x2="316" y2="994" stroke="#2c333a" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="188" y="188" width="210" height="40" fill="#ffffff"/>
  <text x="196" y="206" font-size="13" fill="#1f2933">Search, offer a ride,</text>
  <text x="196" y="222" font-size="13" fill="#1f2933">reserve a seat [HTTPS]</text>

  <rect x="490" y="192" width="268" height="24" fill="#ffffff"/>
  <text x="498" y="210" font-size="13" fill="#1f2933">Moderate users and reports [HTTPS]</text>

  <rect x="586" y="348" width="204" height="40" fill="#f4f7fb"/>
  <text x="594" y="366" font-size="13" fill="#1f2933">User actions and</text>
  <text x="594" y="382" font-size="13" fill="#1f2933">screen data [HTTPS/JSON]</text>

  <rect x="1148" y="348" width="164" height="36" fill="#ffffff"/>
  <text x="1156" y="364" font-size="13" fill="#1f2933">Register and verify</text>
  <text x="1156" y="380" font-size="13" fill="#1f2933">students [HTTPS]</text>

  <rect x="600" y="508" width="350" height="54" fill="#f4f7fb"/>
  <text x="608" y="526" font-size="13" fill="#1f2933">Read and write users, trips, reservations,</text>
  <text x="608" y="542" font-size="13" fill="#1f2933">reports; enqueue notifications</text>
  <text x="608" y="558" font-size="13" fill="#1f2933">[PostgreSQL]</text>

  <rect x="590" y="676" width="250" height="40" fill="#f4f7fb"/>
  <text x="598" y="694" font-size="13" fill="#1f2933">Read pending notification records</text>
  <text x="598" y="710" font-size="13" fill="#1f2933">[PostgreSQL]</text>

  <rect x="340" y="860" width="300" height="40" fill="#f4f7fb"/>
  <text x="348" y="878" font-size="13" fill="#1f2933">Send e-mail about reservation</text>
  <text x="348" y="894" font-size="13" fill="#1f2933">and trip changes [SMTP]</text>

  <!-- Legend -->
  <rect x="1320" y="100" width="400" height="150" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
  <text x="1340" y="126" font-size="14" font-weight="700" fill="#1f2933">Legend</text>
  <rect x="1340" y="142" width="18" height="14" rx="2" fill="#08427B"/>
  <text x="1368" y="154" font-size="13" fill="#1f2933">Person</text>
  <rect x="1340" y="168" width="18" height="14" rx="2" fill="#438DD5"/>
  <text x="1368" y="180" font-size="13" fill="#1f2933">Container inside the system</text>
  <rect x="1340" y="194" width="18" height="14" rx="2" fill="#8a8a8a"/>
  <text x="1368" y="206" font-size="13" fill="#1f2933">External system</text>
  <line x1="1340" y1="226" x2="1366" y2="226" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1368" y="230" font-size="13" fill="#1f2933">System boundary</text>
</svg>
